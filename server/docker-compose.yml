services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maxvolt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maxvolt"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/maxvolt?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ../backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/maxvolt
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
